name: Validate shaders

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install GLSL validator
        run: sudo apt-get update && sudo apt-get install -y glslang-tools
      - name: Validate generated entry points
        run: python tools/build_entrypoints.py --check
      - name: Test validation and benchmark tools
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Compile and link shader variants
        run: python tools/validate.py --compile
