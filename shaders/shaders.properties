screen.MATERIALS = MATERIAL_MAPS NORMAL_STRENGTH MATERIAL_SHINE GLASS_SHINE SURFACE_SHEEN
screen.DIMENSIONS = DIMENSION_STYLE BIOME_ATMOSPHERE
screen.PHOTO = AERO_PHOTO_MODE PHOTO_AUTOFOCUS PHOTO_FOCUS_DISTANCE PHOTO_APERTURE PHOTO_LETTERBOX
screen.columns = 2
screen.COLORS.columns = 2
screen.NATURE.columns = 2
screen.WATER.columns = 2
screen.CRYSTAL.columns = 2
screen.SKY.columns = 2
screen.WEATHER.columns = 2
screen.LIGHT.columns = 2
