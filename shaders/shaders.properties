size.buffer.colortex6 = 0.5 0.5
size.buffer.colortex7 = 0.5 0.5

oldLighting = false
oldHandLight = false
dynamicHandLight = false
underwaterOverlay = false
vignette = false

clouds = off
sun = false
moon = false
stars = false

# Smooth biome boundaries in seconds; IDs must remain unique in this pack.
uniform.float.aeroTemperature = smooth(81, temperature, 8, 8)
uniform.float.aeroRainfall = smooth(82, rainfall, 8, 8)
uniform.float.aeroPrecipitation = smooth(83, if(biome_precipitation == 1, 1, 0), 6, 6)

# Material metadata must be replaced, never alpha blended with prior geometry.
blend.gbuffers_terrain.colortex1 = off
blend.gbuffers_terrain_solid.colortex1 = off
blend.gbuffers_terrain_cutout.colortex1 = off
blend.gbuffers_entities.colortex1 = off
blend.gbuffers_block.colortex1 = off
blend.gbuffers_hand.colortex1 = off
blend.gbuffers_textured.colortex1 = off
blend.gbuffers_textured_lit.colortex1 = off
blend.deferred = off
blend.shadow = off
shadowTranslucent = true
blend.gbuffers_terrain.colortex2 = off
blend.gbuffers_terrain_solid.colortex2 = off
blend.gbuffers_terrain_cutout.colortex2 = off
blend.gbuffers_entities.colortex2 = off
blend.gbuffers_block.colortex2 = off
blend.gbuffers_hand.colortex2 = off
blend.gbuffers_textured.colortex2 = off
blend.gbuffers_textured_lit.colortex2 = off
