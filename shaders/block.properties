# AeroDream v1.4 - distinct categories for the grass block, blades, tall plants,
# leaves and crops. The green grass_block top is biome tinted by Minecraft.
# Names unknown to a given Minecraft version are ignored by the loader.
block.10001 = water

# Ordinary rooted blades, wildflowers, ferns and small greenery.
block.10010 = grass short_grass fern dead_bush bush short_dry_grass tall_dry_grass dandelion poppy blue_orchid allium azure_bluet red_tulip orange_tulip white_tulip pink_tulip oxeye_daisy cornflower lily_of_the_valley torchflower pink_petals wildflowers closed_eyeblossom open_eyeblossom brown_mushroom red_mushroom crimson_fungus warped_fungus oak_sapling spruce_sapling birch_sapling jungle_sapling acacia_sapling dark_oak_sapling mangrove_propagule cherry_sapling pale_oak_sapling

# Leaves and bushes receive softer wind, including flowering foliage.
block.10011 = oak_leaves birch_leaves spruce_leaves jungle_leaves acacia_leaves dark_oak_leaves mangrove_leaves azalea_leaves flowering_azalea_leaves cherry_leaves pale_oak_leaves azalea flowering_azalea

# Ground cover must be separate from grass blades: NO vertex displacement!
block.10012 = grass_block moss_block moss_carpet

# Transparent / icy / emissive materials.
block.10013 = glass glass_pane white_stained_glass light_blue_stained_glass blue_stained_glass cyan_stained_glass lime_stained_glass green_stained_glass pink_stained_glass magenta_stained_glass purple_stained_glass red_stained_glass orange_stained_glass yellow_stained_glass black_stained_glass gray_stained_glass light_gray_stained_glass brown_stained_glass
block.10014 = ice packed_ice blue_ice frosted_ice
block.10016 = glowstone sea_lantern shroomlight ochre_froglight verdant_froglight pearlescent_froglight end_rod jack_o_lantern lantern soul_lantern redstone_lamp:lit=true

# Plants rendered beneath water, with gentler waving.
block.10015 = seagrass tall_seagrass kelp kelp_plant

# Crops are rooted; they should not slide across the farmland.
block.10017 = wheat carrots potatoes beetroots sweet_berry_bush nether_wart pitcher_crop

# Double-tall plants are mapped by block state. The upper and lower segments
# bend smoothly as one plant, instead of separating at their shared seam.
block.10018 = tall_grass:half=lower large_fern:half=lower sunflower:half=lower lilac:half=lower rose_bush:half=lower peony:half=lower pitcher_plant:half=lower
block.10019 = tall_grass:half=upper large_fern:half=upper sunflower:half=upper lilac:half=upper rose_bush:half=upper peony:half=upper pitcher_plant:half=upper

# Subtle dry/wet specular sheen on manufactured, polished materials.
block.10020 = iron_block gold_block diamond_block emerald_block lapis_block copper_block exposed_copper weathered_copper oxidized_copper waxed_copper_block waxed_exposed_copper waxed_weathered_copper waxed_oxidized_copper quartz_block smooth_quartz quartz_pillar polished_diorite polished_andesite polished_granite polished_deepslate polished_blackstone prismarine_bricks smooth_stone cut_copper cut_copper_stairs cut_copper_slab

# Tinted glass retains its intentional darkness and higher opacity.
block.10022 = tinted_glass

# Snow is solid terrain, intentionally not part of grass or moving foliage.
block.10023 = snow snow_block powder_snow
